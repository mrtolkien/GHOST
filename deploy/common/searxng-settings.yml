use_default_settings: true

server:
  bind_address: "0.0.0.0"
  secret_key: "ghost-searxng-secret"

search:
  formats:
    - html
    - json
  default_lang: "en"

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
