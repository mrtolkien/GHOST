# Sidecar services for Ghost (ghost itself runs natively, not in Docker)
services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "127.0.0.1:11235:11235"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./deploy/common/searxng-settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  chrome:
    image: chromedp/headless-shell:stable
    ports:
      - "127.0.0.1:9222:9222"
    volumes:
      - ${GHOST_WORKSPACE:-~/GHOST}/uploads:/uploads:ro
    shm_size: "2gb"
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
