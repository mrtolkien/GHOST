  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped

  chrome:
    image: chromedp/headless-shell:stable
    ports:
      - "127.0.0.1:9222:9222"
    shm_size: "2gb"
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
