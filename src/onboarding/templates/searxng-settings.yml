use_default_settings: true

server:
  bind_address: "0.0.0.0"
  secret_key: "ghost-searxng-secret"

search:
  formats:
    - html
    - json
  default_lang: "en"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0

# With use_default_settings, all engines are loaded from upstream defaults.
# We only override `disabled` to curate which ones are active.
# As of March 2026, DDG/Startpage are aggressively blocking SearXNG.
# Google is intermittent but worth keeping — it auto-suspends on CAPTCHA.
engines:
  # --- Disabled: persistently blocked ---
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true

  # --- Enabled: reliable or intermittently useful ---
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: presearch
    disabled: false
  - name: mwmbl
    disabled: false
