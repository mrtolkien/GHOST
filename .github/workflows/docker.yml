name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-binary:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config cmake
      - run: cargo build --release && strip target/release/ghost
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.arch }}
          path: target/release/ghost

  release:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p ghost-bin/x86_64 ghost-bin/aarch64
          cp ghost-x86_64/ghost ghost-bin/x86_64/ghost
          cp ghost-aarch64/ghost ghost-bin/aarch64/ghost
          chmod +x ghost-bin/*/ghost
          tar czf ghost-bin.tar.gz -C ghost-bin .
      - uses: softprops/action-gh-release@v2
        with:
          files: ghost-bin.tar.gz

  update-lock:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update flake.lock to new release
        run: nix flake update
      - name: Commit updated flake.lock
        env:
          GH_REF: ${{ github.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: update flake.lock for ${GH_REF#refs/tags/}"
          git push
